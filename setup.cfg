[flake8]
max-line-length = 88
exclude =
    .venv,
    build,
    dist,
    *.egg-info,
    __pycache__
per-file-ignores =
    src/zerodha_data_fetcher/__init__.py:F401
    src/zerodha_data_fetcher/utils/__init__.py:F401
    src/zerodha_data_fetcher/utils/helpers.py:F841
# E501: line length handled by Black
# E203: whitespace before ':' (conflicts with Black)
# W503: line break before binary operator (conflicts with Black)
# W291: trailing whitespace (handled by pre-commit trailing-whitespace hook)
extend-ignore = E203, W503, E501, W291
